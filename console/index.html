  <!-- Geist and Geist Mono, both variable.

       Inter was the previous face and it is the single clearest tell that an
       interface was generated rather than designed: it is the default of every
       template and every AI mock, so a security console wearing it reads as a
       screenshot of a product rather than a product. Geist is drawn for
       interfaces, has genuine tabular figures, and its mono is a matched
       family rather than a borrowed one - which matters here, because this
       console sets IP addresses, MAC addresses, UUIDs and counts in mono
       beside sans labels on every row of 54 screens. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap">
