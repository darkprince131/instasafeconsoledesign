<body>

<symbol id="i-funnel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6" height="6" rx="1.4"/><rect x="14" y="4" width="6" height="6" rx="1.4"/><rect x="4" y="14" width="6" height="6" rx="1.4"/><rect x="14" y="14" width="6" height="6" rx="1.4"/></symbol>

<symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4" stroke-linecap="round"/></symbol>

<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2m-8 0 1 13h8l1-13"/></symbol>

<symbol id="i-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/></symbol>
<symbol id="i-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m14 6-6 6 6 6"/></symbol>
<symbol id="i-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m10 6 6 6-6 6"/></symbol>

<symbol id="i-dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></symbol>

<symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/></symbol>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand"><span class="mark" role="img" aria-label="InstaSafe"></span><span class="wm">InstaSafe</span><span class="tenant">veno</span></div>
    <div class="navwrap" id="nav"></div>
    <div class="railfoot"><span class="av">DD</span><span>Debajyoti</span></div>
  </aside>
  <main class="main" id="main">
    <div class="topbar">
      <button class="tbtn" id="menuBtn" style="display:none" aria-label="Navigation"><svg><use href="#i-panel"/></svg></button>
      <span class="crumb" id="crumb"></span>
      <span class="tgroup">
        <span class="sessclock" id="clock">02:43:22</span>
        <button class="tbtn" id="railBtn"><svg><use href="#i-panel"/></svg><span id="railLbl">Dark rail</span></button>
        <button class="tbtn" id="themeBtn"><svg><use href="#i-moon"/></svg><span id="themeLbl">Dark</span></button>
      </span>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>

<button class="fab" id="fab" data-proto="1"><svg><use href="#i-sliders"/></svg> States</button>
<aside class="sr2" id="sr2" data-proto="1" aria-label="Prototype controls">
  <div class="sr2h"><svg style="width:15px;height:15px"><use href="#i-sliders"/></svg><b>Prototype states</b>
    <button class="tbtn" id="sr2x" aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
  <div class="sr2b" id="sr2b"></div>
</aside>
<div class="toasts" id="toasts"></div>
<div id="layer"></div>
<script src="assets/js/console.js"></script>
</body>
</html>
