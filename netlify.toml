# Static site: no build step. Everything is hand-written HTML, CSS and JS.
[build]
  publish = "."
  command = ""

# Branch deploys give every branch its own URL on the same site:
#   main          -> https://<site>.netlify.app
#   enhanced-ux   -> https://enhanced-ux--<site>.netlify.app
# Turn them on under Site configuration > Build & deploy > Branch deploys.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
